version : "3.9"
services:
  api:
    build: .
    container_name: customer_churn_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env


    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3